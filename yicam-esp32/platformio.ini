; yicam-bridge firmware for a classic ESP32 DevKit (ESP-WROOM-32, CP2102, no PSRAM)
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    mlesniew/PicoMQTT@^1.3.0
    tzapu/WiFiManager@^2.0.17

; First flash over USB:   pio run -e usb -t upload && pio device monitor
[env:usb]

; Later updates over Wi-Fi: pio run -e ota -t upload
; (set the OTA password in the setup portal; pass it with --upload-flags or
;  PLATFORMIO_UPLOAD_FLAGS="--auth=<password>")
[env:ota]
upload_protocol = espota
upload_port = yicam-bridge.local
